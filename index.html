<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>君王心术·七维测验</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1a1a1f;
      --card-border: #2d2d38;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text: #e6e6eb;
      --text-muted: #9595a6;
      --accent: #8b1e1e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #252530;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 7%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transition: width 0.3s ease;
    }

    /* 顶部导航控制行（进度编号 + 返回按钮） */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .step-indicator {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
    }

    .prev-btn {
      background: transparent;
      border: 1px solid #3d3d4d;
      color: var(--text-muted);
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .prev-btn:hover:not(:disabled) {
      color: var(--gold);
      border-color: var(--gold);
    }

    .prev-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #2a2a35;
    }

    .question-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .question-scenario {
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 24px;
      background: #151518;
      padding: 16px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #202029;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px 18px;
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: #282835;
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    /* 封面页专属样式 */
    .cover-container {
      text-align: center;
      padding: 12px 8px;
      animation: fadeIn 0.6s ease;
    }

    .cover-silhouette {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.45));
    }

    .cover-silhouette svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cover-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .cover-subtitle {
      font-size: 0.95rem;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .cover-intro {
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--text-muted);
      text-align: justify;
      background: #151518;
      padding: 18px 20px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      margin-bottom: 28px;
    }

    .cover-intro p:first-child {
      color: var(--gold-light);
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 500;
    }

    .cover-intro p:last-child {
      margin-bottom: 0;
      line-height: 1.8;
    }

    .start-btn {
      background: linear-gradient(135deg, var(--gold), #967822);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 14px 40px;
      border-radius: 28px;
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 2px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
    }

    /* 结果页样式 */
    .result-container {
      display: none;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .result-badge {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .result-emperor {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .result-dimensions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .dim-tag {
      background: #262633;
      border: 1px solid #3d3d52;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .dim-tag.pos {
      color: #98d8aa;
      border-color: #3b6b47;
    }

    .dim-tag.neg {
      color: #f79595;
      border-color: #7a3131;
    }

    /* 七维特性列表样式 */
    .result-section-title {
      font-size: 0.95rem;
      color: var(--gold-light);
      letter-spacing: 1px;
      margin: 20px 0 12px 0;
      text-align: left;
      border-bottom: 1px dashed #3a3a4c;
      padding-bottom: 6px;
    }

    .dimension-traits-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      text-align: left;
    }

    .trait-item {
      background: #1b1b22;
      border: 1px solid #2d2d3a;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
    }

    .trait-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .trait-badge.pos {
      background: rgba(152, 216, 170, 0.15);
      color: #98d8aa;
      border: 1px solid #3b6b47;
    }

    .trait-badge.neg {
      background: rgba(247, 149, 149, 0.15);
      color: #f79595;
      border: 1px solid #7a3131;
    }

    .trait-desc {
      color: #c5c5d2;
      line-height: 1.45;
      font-size: 0.86rem;
    }

    .result-desc {
      text-align: left;
      background: #16161b;
      padding: 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #c5c5d2;
      border-top: 2px solid var(--gold);
      margin-bottom: 28px;
    }

    .restart-btn {
      background: linear-gradient(135deg, var(--gold), #967822);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .restart-btn:hover {
      opacity: 0.9;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 1. 封面页 -->

      "1100110": { title: "唐敬宗", name: "李湛", desc: "不喜盛大营建、深居内宫迷恋手搏与姬妾、性尚仁懦、但喜设机巧小智愚弄宦官。" },
      "1100101": { title: "明穆宗（隆庆）", name: "朱载坖", desc: "恭逊寡言、穿洗旧之衣、委政张居正与高拱（逸）、沉湎后宫服春药、内帑锁闭甚吝。" },
      "1100100": { title: "汉哀帝", name: "刘欣", desc: "雅性不好声乐奢靡、但沉溺董贤男色、退居别殿怠政、外宽内忌用机权罢逐重臣。" },
      "1100011": { title: "南朝齐郁林王", name: "萧昭业", desc: "穿破衣假俭、性荒淫通叔母、荒怠朝政、但喜滥赏左右近侍、好残戮政敌。" },
      "1100010": { title: "北齐幼主", name: "高恒", desc: "寄人篱下虚敬太上皇、无内修之奢但宫闱乱伦、怠荒丧国、残虐宫婢、诡诈以避诛。" },
      "1100001": { title: "南朝宋少帝", name: "刘义符", desc: "不营华池大殿、好造角抵场杂戏、深宫内帏无度、居丧荒怠、杀大臣无恩。" },
      "1100000": { title: "东晋废帝", name: "司马奕", desc: "俭朴退避、被桓温诬以男宠后宫秽乱、消极避祸怠政、遭废黜前隐忍诈病。" },
      "1011111": { title: "唐玄宗（天宝前）", name: "李隆基", desc: "接纳姚崇宋璟谠言、虽好修建华清池排场、但对杨贵妃情笃专一、夙夜图治、好赏赐四方。" },
      "1011110": { title: "宋太宗", name: "赵光义", desc: "喜延揽儒臣、大修皇家藏书宫馆、性节女色、勤批奏牍至深夜、行烛影斧声机巧之策。" },
      "1011101": { title: "隋文帝", name: "杨坚", desc: "崇尚信实、虽开皇大建大兴城、但独宠独孤皇后无别姬（节）、勤于听政、对府库极吝外放。" },
      "1011100": { title: "清宣宗（道光）", name: "旻宁", desc: "虽然俭朴名声在外但内廷实务靡费、御下严厉吝啬放饷、深藏机心。" },
      "1011011": { title: "明成祖（永乐）", name: "朱棣", desc: "听夏原吉谏言、大建紫禁城远征漠北（奢）、私德甚少滥宠、靖难削株蔓引（暴）、恩赏武臣极厚。" },
      "1011010": { title: "秦始皇", name: "嬴政", desc: "能纳尉缭李斯、大兴阿房陵寝、不沉溺女色、勤批重百斤竹简、焚书坑儒严法、大施机变灭六国。" },
      "1011001": { title: "后周太祖", name: "郭威", desc: "崇儒重道、军旅开支庞大、不近女色、力疾勤政、处置叛将断然绝情、对国帑极其看守。" },
      "1011000": { title: "西楚霸王", name: "项羽", desc: "谦敬长者（妇人之仁）、烧阿房拥重资、情专虞姬、躬亲督战、坑杀秦降卒（暴）、印刓不授（吝）。" },
      "1010111": { title: "宋英宗", name: "赵曙", desc: "待辅臣和逊、营缮宫殿有加、无声色之好、病笃怠政、性行仁慈、厚抚宗室。" },
      "1010110": { title: "汉安帝", name: "刘祜", desc: "谦畏外戚、大修离宫、守礼无多宠、久怠庶务委政邓氏与宦官、待邓氏后以计诛之。" },
      "1010101": { title: "晋惠帝", name: "司马衷", desc: "愚钝谦退、何不食肉糜所见奢华、与贾南风相敬无外色、痴呆怠政、性本纯仁不忍害人。" },
      "1010100": { title: "南陈后主", name: "陈叔宝", desc: "谦接群臣、大建临春结绮阁（奢）、宠张丽华而不广滥、废弃朝政倚井自藏、善言令伪诈。" },
      "1010011": { title: "南朝宋前废帝", name: "刘子业", desc: "尊儒臣为表、大修殿堂、无节制杀戮诸叔（暴）、行事乖张赏赐无度、但对所好直言不讳。" },
      "1010010": { title: "后赵武帝", name: "石虎", desc: "降尊纳佛图澄、大建襄国宫殿、残杀亲子及后妃（暴）、怠政好杀、攻战屠城诡变。" },
      "1010001": { title: "前秦幼主", name: "苻生", desc: "尚武接物质朴、好造华丽行宫、政务全委臣下、好手刃重臣（暴）、吝于封功、残暴直露。" },
      "1010000": { title: "北齐后主", name: "高纬", desc: "优待倡优、大修晋阳宫室、纵情自娱不问政、诛杀斛律光兰陵王、吝惜内帑、好阴谋暗算。" },
      "1001111": { title: "唐中宗", name: "李显", desc: "优柔谦抑、纵容安乐公主大修第宅、宫廷秽乱不察、勤于和解宗室与外戚、对朝臣大施爵赏。" },
      "1001110": { title: "汉武帝", name: "刘彻", desc: "虽独尊儒术能纳主父偃、修建建章宫、女色极众、雄才大略巡行天下（勤）、晚年寄托巫蛊以权术治下。" },
      "1001101": { title: "魏文帝", name: "曹丕", desc: "善听华歆辛毗谏、大修洛阳宫殿、广纳二女与郭甄、勤于著述与政制、对曹洪极度吝惜金钱。" },
      "1001100": { title: "金世宗", name: "完颜雍", desc: "谦称小尧舜、兴筑金中都、女侍繁缛、躬亲治道、控御财政甚严、推行女真本位权谋。" },
      "1001011": { title: "北魏太武帝", name: "拓跋焘", desc: "谦抚战将、营建平城台观、后宫广置、戎马倥偬一生、灭佛严酷杀戮（暴）、重赏降臣。" },
      "1001010": { title: "吴大帝", name: "孙权", desc: "屈身忍辱纳群臣、晚年大建宫苑、后宫离乱、精力过人勤于政事、南鲁党争残戮辅臣（暴/诈）。" },
      "1001001": { title: "梁武帝（早中期）", name: "萧衍", desc: "纳贺琛直言、大修佛寺同泰寺（奢）、广蓄乐妓、宵衣旰食、侯景之乱前用法过苛且吝赏。" },
      "1001000": { title: "前燕景昭帝", name: "慕容儁", desc: "待大臣以礼、营建邺城、宫闱多宠、克勤军政、严刑征发、吝啬颁赏、诈降诱敌。" },
      "1000111": { title: "蜀汉后主（晚年）", name: "刘禅", desc: "谦逊放权、修筑后庭、后宫繁琐、深居游宴不视事、仁慈赦罪、大赐蜀中勋贵。" },
      "1000110": { title: "宋徽宗", name: "赵佶", desc: "善遇文人、修筑艮岳花石纲、纵情青楼李师师、怠政委任蔡京童贯、用联金灭辽之权诈。" },
      "1000101": { title: "明宪宗（成化）", name: "朱见深", desc: "宽和谦卑、宠万贵妃纵容皇庄奢靡、怠政万贵妃专宠、仁厚复景泰帝名号、吝于发内库赈灾。" },
      "1000100": { title: "汉成帝", name: "刘骜", desc: "优容许氏班婕妤、大起宵游宫、沉迷赵飞燕合德、委政王氏怠政、暗杀皇嗣（诈/匿）。" },
      "1000011": { title: "陈文帝", name: "陈蒨", desc: "礼贤下士、宫室崇盛、韩子高及后宫流风、疏于政刑、滥杀王昙朗等宗室（暴）。" },
      "1000010": { title: "北齐文宣帝（晚期）", name: "高洋", desc: "始尊儒谦恭、后大建三台宫殿、淫乱宗室诸女、酗酒废政、醉中当街剖杀人（暴/狂诈）。" },
      "1000001": { title: "吴末帝", name: "孙皓", desc: "初即位发仓廪谦和、继而大修新宫、开凿青溪、后宫五千人、怠荒万机、剥人面皮（暴/吝）。" },
      "1000000": { title: "隋炀帝", name: "杨广", desc: "即位前伪饰恭俭清心（诈）、即位后建东都修运河（奢）、广选江南美女、沉溺江都、诛戮忠良、聚敛天下。" },
      "0111111": { title: "汉文帝", name: "刘恒", desc: "偶露矜骄自诩兵威、身着弋绨、宠慎夫人但重节制、废肉刑、休养生息、待天下以信义。" },
      "0111110": { title: "后周世宗", name: "柴荣", desc: "雄视天下自信甚高（骄）、躬行节俭、无女色之私、亲征不辍勤政、仁育黔首、破佛毁寺兼施权宜。" },
      "0111101": { title: "汉景帝", name: "刘启", desc: "骄自天生诛晁错、崇尚黄老从俭、后宫治肃、削藩治国勤勉、实行阳德轻刑、极度吝于封王封侯。" },
      "0111100": { title: "宋太祖", name: "赵匡胤", desc: "傲视五代群雄、衣着浣濯、终生不近骄奢女色、雪夜访普勤政、杯酒释兵权施机诈、收回诸藩财权。" },
      "0111011": { title: "明思宗（崇祯）", name: "朱由检", desc: "刚愎自用誓不认错（骄）、衣冠带补丁（俭）、内廷无宠、批阅奏章达旦、凌迟袁崇焕诛戮督抚（暴）、推心待烈士。" },
      "0111010": { title: "新朝始建国皇帝", name: "王莽", desc: "妄自尊大改制乱象、食不兼肉（俭）、不好女色、夙兴夜寐批符命、用法惨烈严苛（暴）、靠禅让伪诈登基。" },
      "0111001": { title: "前秦景明帝", name: "苻健", desc: "割据关陇傲睨群雄、食无重味、独专军政、嗜杀豪强部曲、惜财不轻赐部从。" },
      "0111000": { title: "南朝宋孝武帝", name: "刘骏", desc: "刚愎猜忌、生活简练、治国勤谨、但大杀宗室兄弟二十八人（暴）、聚敛财赋入内帑、手段阴毒。" },
      "0110111": { title: "晋武帝（太康前）", name: "司马炎", desc: "混一天下自满傲然、羊车望幸前朴素治国、深宫寄政贾充、行优容宽大之仁、分封诸王极尽推恩。" },
      "0110110": { title: "明光宗（泰昌）", name: "朱常洛", desc: "潜邸隐忍、登位自视甚高、撤罢矿税（施仁）、万历怠政之风犹存、红丸案诸事充满深宫诈谋。" },
      "0110101": { title: "唐高祖（后期）", name: "李渊", desc: "得天下后骄矜纵逸、生活未见巨靡、居禁中委政太子与秦王、天性宽仁、对军功金帛核算极紧。" },
      "0110100": { title: "刘宋少帝", name: "刘义符", desc: "虽骄纵游玩、未大修台阁、深宫戏游荒怠、少诛杀之暴、封赏吝吝、设木人奇计自乐。" },
      "0110011": { title: "西夏毅宗", name: "李谅祚", desc: "刚愎亲政、行伍俭约、疏于政事好出猎、诛杀没藏讹庞全族（暴）、赏赐军士不吝。" },
      "0110010": { title: "金海陵王（初年）", name: "完颜亮", desc: "志傲中原天下唯我独尊、力行女真俭礼、荒怠朝仪、大杀金太宗子孙宗室（暴/诈）。" },
      "0110001": { title: "后汉高祖", name: "刘知远", desc: "骄抗晋命、军旅简朴、得国后倦勤怠政、杀戮无辜降卒、吝惜官库财赋不敢犒军。" },
      "0110000": { title: "后晋出帝", name: "石重贵", desc: "傲慢对契丹称孙不称臣、国库空虚无大奢、沉湎酒戏怠政、刑赏无序诛杀忠臣、搜括民财入内库。" },
      "0101111": { title: "唐太宗", name: "李世民", desc: "自负威加四海晚年稍骄、宫室尚求俭朴（罢建昭阳殿）、好色纳杨妃充华、抚民若子、恩及异族。" },
      "0101110": { title: "汉高祖", name: "刘邦", desc: "傲慢箕踞侮慢儒生、布衣天子恶靡丽、喜好女色戚夫人、开基立业勤政、约法三章（仁）、伪游云梦擒韩信（诈）。" },
      "0101101": { title: "后唐庄宗（早年）", name: "李存勖", desc: "自命世之雄、军中同甘共苦、喜纳降女为姬、冲锋陷阵亲冒矢石、爱恤士卒、然出赏甚吝。" },
      "0101100": { title: "明世宗（嘉靖）", name: "朱厚熜", desc: "刚愎大礼议傲视群臣、修道用费甚隐不修宫、御女采补红铅、玄修二十载不废政权掌控、机变诈术如鬼神。" },
      "0101011": { title: "北魏献文帝", name: "拓跋弘", desc: "自矜刚毅、食不重肉、内宠颇多、治兵讲武、怒杀冯太后男宠李弈（暴）、厚施军饷。" },
      "0101010": { title: "魏武帝（魏王）", name: "曹操", desc: "英雄自负、操虽身居梓宫俭朴如素、好倡妇铜雀台、夙夜军政、宛城杀降借头杀粮官（暴/诈）。" },
      "0101001": { title: "后梁末帝", name: "朱友贞", desc: "盲目自大、未见华美修饰、宫禁杂乱、勤于奔命排兵、诛杀近侍、藏金国库不肯发给将士。" },
      "0101000": { title: "南朝宋明帝", name: "刘彧", desc: "自负能书善画、不崇华丽、借腹生子宫帏秽乱、勤阅刑奏、诛杀诸弟残暴无比、诈设巫蛊。" },
      "0100111": { title: "陈后主（陷落前）", name: "陈叔宝", desc: "自负山河之险傲然不备、少营盛大武备、后宫群芳尽览、宴乐终日怠政、待臣下恩慈滥赏。" },
      "0100110": { title: "唐宪宗（晚年）", name: "李纯", desc: "削藩成功后自骄自大、虽无大内修缮、好女色迎佛骨、沉溺金丹怠政、任用裴度但暗中权术制衡。" },
      "0100101": { title: "明神宗（万历）", name: "朱翊钧", desc: "自尊为天子群臣奈何、常服洗浣、专宠郑贵妃、三十年不上朝（逸）、待民非酷刑、定陵耗费但内库极吝。" },
      "0100100": { title: "宋理宗", name: "赵昀", desc: "理学自居自矜正统、宫用平平、荒淫晚节阎贵妃、委政贾似道二十年、待臣仁懦、吝发内府帑银。" },
      "0100011": { title: "前赵末帝", name: "刘曜", desc: "骄慢自持纵酒狂呼、不尚外物盛奢、多纳关陇妇女、决战宿醉不视前线、拔剑虐杀逆命者、散财厚葬。" },
      "0100010": { title: "南齐东昏侯", name: "萧宝卷", desc: "傲视礼法、衣服简狭、荒淫与潘玉儿并骑、不坐朝廷唯好鬼戏、发兵毁民居纵暴、机阱杀臣。" },
      "0100001": { title: "南汉后主", name: "刘鋹", desc: "骄狂不可一世、居无重楼、宫女太监共戏荒淫、国政尽委女巫樊胡子、设汤镬毒象屠民、私藏珍宝。" },
      "0100000": { title: "北齐废帝", name: "高殷", desc: "幼年傲岸、生活素朴、为娄太后诸党所挤沉溺后宫、退居深宫政荒、为高演逼杀前以权变求存。" },
      "0011111": { title: "清圣祖（康熙晚期）", name: "玄烨", desc: "功德圆满自傲不凡、六下江南耗资不赀（奢）、晚年清修节制声色、勤政六十年如一日、行宽仁之政、蠲免天下钱粮。" },
      "0011110": { title: "清高宗（乾隆）", name: "弘历", desc: "自诩十全老人（骄）、修圆明园下江南盛极奢华、专情孝贤纯皇后、勤批硃批、好大喜功恩威并济（施/诈）。" },
      "0011101": { title: "宋神宗", name: "赵顼", desc: "志切恢复自视甚高、支撑变法财政大兴官署、私行自律不迩女色、勤图富强、对旧党恩慈、但收缩户部财权。" },
      "0011100": { title: "明宣宗（宣德）", name: "朱瞻基", desc: "骄矜于功名盛世、好促织之戏玩物奢修、后宫自律爱胡皇后与孙贵妃、勤于抚民、宣德治世推行权谋。" },
      "0011011": { title: "十六国夏武烈帝", name: "赫连勃勃", desc: "傲睨万方自号勃勃、大筑统万城极其奢靡、不好女色嗜好征杀、躬亲戎行、杀工匠填城墙（暴）、厚赏将士。" },
      "0011010": { title: "吴越武肃王", name: "钱镠", desc: "称霸江东意气飞扬、修建捍海塘与杭州罗城（奢）、治内肃整、巡察民间治水利、用法峻急屠戮强梁、善结纳中原朝廷。" },
      "0011001": { title: "金哀宗", name: "完颜守绪", desc: "骄自宗室、危难中仍修宫殿、不沉溺声色、勤于应付蒙宋夹攻、逼迫臣僚军法极严、惜财不出封赏。" },
      "0011000": { title: "明景帝（景泰）", name: "朱祁钰", desc: "临危自傲践祚、营建陵寝万机、不近妖艳、勤于抵御也先、幽禁英宗废太子（暴/诈）、内府积银甚秘。" },
      "0010111": { title: "晋武帝（太康后）", name: "司马炎", desc: "灭吴后骄奢自溢、起筑华池行宫、万姬选后但无乱淫之名、置政事于度外（逸）、施恩博厚、笃信大臣。" },

    const selectedHistory = [];

    function renderQuestion() {
      const q = QUESTIONS[currentQuestionIdx];
      document.getElementById('step-indicator').innerText = `SCENARIO ${String(currentQuestionIdx + 1).padStart(2, '0')} / 14`;
      document.getElementById('question-title').innerText = q.title;
      document.getElementById('question-scenario').innerText = q.scenario;
      document.getElementById('progress-bar').style.width = `${((currentQuestionIdx + 1) / QUESTIONS.length) * 100}%`;

      const prevBtn = document.getElementById('prev-btn');
      prevBtn.disabled = (currentQuestionIdx === 0);

      const optionsList = document.getElementById('options-list');
      optionsList.innerHTML = '';

      q.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt);
        optionsList.appendChild(btn);
      });
    }

    function selectOption(opt) {
      scores[opt.pos] = (scores[opt.pos] || 0) + 1;
      scores[opt.neg] = (scores[opt.neg] || 0) + 1;
      selectedHistory.push(opt);

      currentQuestionIdx++;
      if (currentQuestionIdx < QUESTIONS.length) {
        renderQuestion();
      } else {
        calculateAndShowResult();
      }
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0 && selectedHistory.length > 0) {
        const lastOpt = selectedHistory.pop();
        scores[lastOpt.pos] = Math.max(0, (scores[lastOpt.pos] || 0) - 1);
        scores[lastOpt.neg] = Math.max(0, (scores[lastOpt.neg] || 0) - 1);

        currentQuestionIdx--;
        renderQuestion();
      }
    }

    // 唯一的核心计算与结果渲染函数（已整合七维特性与诠释）
    function calculateAndShowResult() {
      const d1 = (scores.qian >= scores.jiao) ? "1" : "0";
      const d2 = (scores.jian >= scores.she)  ? "1" : "0";
      const d3 = (scores.jie  >= scores.yin)  ? "1" : "0";
      const d4 = (scores.qin  >= scores.yi)   ? "1" : "0";
      const d5 = (scores.ren  >= scores.bao)  ? "1" : "0";
      const d6 = (scores.shi  >= scores.lin)  ? "1" : "0";
      const d7 = (scores.cheng >= scores.zha) ? "1" : "0";

      const profileCode = `${d1}${d2}${d3}${d4}${d5}${d6}${d7}`;
      const emperor = EMPERORS[profileCode] || EMPERORS["1111111"];

      document.getElementById('quiz-box').style.display = 'none';
      const resBox = document.getElementById('result-box');
      resBox.style.display = 'block';

      // 渲染皇帝称号 皇帝名字
      document.getElementById('result-emperor').innerText = `${emperor.title} ${emperor.name}`;

      // 渲染单字色彩标签
      const dimContainer = document.getElementById('result-dimensions');
      dimContainer.innerHTML = `
        <span class="dim-tag ${d1 === '1' ? 'pos' : 'neg'}">${d1 === '1' ? '谦' : '骄'}</span>
        <span class="dim-tag ${d2 === '1' ? 'pos' : 'neg'}">${d2 === '1' ? '俭' : '奢'}</span>
        <span class="dim-tag ${d3 === '1' ? 'pos' : 'neg'}">${d3 === '1' ? '节' : '淫'}</span>
        <span class="dim-tag ${d4 === '1' ? 'pos' : 'neg'}">${d4 === '1' ? '勤' : '逸'}</span>
        <span class="dim-tag ${d5 === '1' ? 'pos' : 'neg'}">${d5 === '1' ? '仁' : '暴'}</span>
        <span class="dim-tag ${d6 === '1' ? 'pos' : 'neg'}">${d6 === '1' ? '施' : '吝'}</span>
        <span class="dim-tag ${d7 === '1' ? 'pos' : 'neg'}">${d7 === '1' ? '诚' : '诈'}</span>
      `;

      // 渲染七维特性与诠释条目
      const traitsListContainer = document.getElementById('dimension-traits-list');
      traitsListContainer.innerHTML = '';

      const bits = [d1, d2, d3, d4, d5, d6, d7];
      bits.forEach((bit, idx) => {
        const dimMeta = DIMENSION_MAP[idx];
        const isPos = (bit === '1');
        const activeTrait = isPos ? dimMeta.pos : dimMeta.neg;

        const row = document.createElement('div');
        row.className = 'trait-item';
        row.innerHTML = `
          <span class="trait-badge ${isPos ? 'pos' : 'neg'}">${dimMeta.name} · ${activeTrait.label}</span>
          <span class="trait-desc">${activeTrait.desc}</span>
        `;
        traitsListContainer.appendChild(row);
      });

      // 渲染史实锚点与通评
      document.getElementById('result-desc').innerText = emperor.desc;
    }

    function startQuiz() {
      document.getElementById('cover-box').style.display = 'none';
      document.getElementById('quiz-box').style.display = 'block';
      renderQuestion();
    }

    function restartQuiz() {
      for (let k in scores) scores[k] = 0;
      currentQuestionIdx = 0;
      selectedHistory.length = 0;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('quiz-box').style.display = 'none';
      document.getElementById('cover-box').style.display = 'block';
    }
  </script>
</body>
</html>
